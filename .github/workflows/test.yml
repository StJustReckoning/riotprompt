name: Run Tests

on:
  push:
    branches:
      - main
      - working
      - 'release/**'
      - 'feature/**'
      - 'dependabot/**'
  pull_request:
    branches:
      - main

concurrency:
  group: test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cache npm artifacts
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install dependencies
        run: |
          # Use public npm registry (package-lock.json is gitignored)
          npm config set registry https://registry.npmjs.org/
          npm config set prefer-offline true
          npm config set fund false
          npm config set audit false
          # Clean install to ensure platform-specific optional deps (rollup native bindings) are resolved correctly
          # See: https://github.com/npm/cli/issues/4828
          rm -rf node_modules
          npm install --force --no-package-lock --prefer-offline --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
        timeout-minutes: 20
      - run: npm run lint
      - run: npm run build
      - run: npm run test

